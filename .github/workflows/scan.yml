name: LEAPP Parity Scan

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scanner repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run parity scanner
        # The scanner is pairwise, so loop iLEAPP against each sibling. iLEAPP is the
        # baseline because shared infrastructure lands there first, which makes
        # "missing from the comparison" the signal worth reading. Each pair writes to
        # reports/<baseline>-vs-<comparison>/ so runs do not overwrite each other.
        run: |
          set -e
          for comparison in aleapp rleapp vleapp dleapp; do
            echo "::group::ileapp vs $comparison"
            python -m scanner.run --comparison "$comparison" --verbose
            echo "::endgroup::"
          done

      - name: Commit updated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --staged --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: update parity scan reports"
            git push
          fi
